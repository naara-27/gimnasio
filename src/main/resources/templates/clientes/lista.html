<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Gestión de Clientes</span>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/clientes/perfil}" class="text-white text-decoration-none">Mi Perfil</a>
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Lista de Clientes</h4>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/clientes/nuevo}" class="btn btn-primary">Nuevo Cliente</a>
        </div>

        <form class="d-flex mb-3" th:action="@{/clientes}" method="get">
            <input type="text" name="q" class="form-control me-2" placeholder="Buscar..." th:value="${q}">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary ms-2">Limpiar</a>
        </form>

        <table class="table table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Cédula</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Rol</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.id}"></td>

                    <td>
                        <a th:href="@{/clientes/{id}(id=${c.id})}" th:text="${c.nombre}"></a>
                    </td>

                    <td th:text="${c.cedula}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.telefono}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${c.activo} ? 'bg-success' : 'bg-secondary'"
                              th:text="${c.activo} ? 'Activo' : 'Inactivo'">
                        </span>
                    </td>

                    <td>
                        <span class="badge"
                              th:classappend="${c.rol == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                              th:text="${c.rol}">
                        </span>
                    </td>

                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/clientes/{id}/editar(id=${c.id})}" class="btn btn-sm btn-warning">Editar</a>

                        <form th:action="@{/clientes/{id}/eliminar(id=${c.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Desea eliminar este cliente?');">

                            <button class="btn btn-sm btn-danger">Eliminar</button>

                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="8" class="text-center text-muted">
                        No hay clientes en el sistema
                    </td>
                </tr>

            </tbody>
        </table>
    </div>
</body>
</html>
