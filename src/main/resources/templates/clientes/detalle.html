<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Detalle de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Gestión de Clientes</span>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/clientes/perfil}" class="text-white text-decoration-none">Mi Perfil</a>
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <h3>Detalle de Cliente</h3>

        <div class="card">
            <div class="card-body">
                <p><b>ID:</b> <span th:text="${cliente.id}"></span></p>

                <p><b>Nombre:</b> <span th:text="${cliente.nombre}"></span></p>

                <p><b>Cédula:</b> <span th:text="${cliente.cedula}"></span></p>

                <p><b>Email:</b> <span th:text="${cliente.email}"></span></p>

                <p><b>Teléfono:</b> <span th:text="${cliente.telefono}"></span></p>

                <p>
                    <b>Estado:</b>
                    <span th:text="${cliente.activo} ? 'Activo' : 'Inactivo'"></span>
                </p>

                <p><b>Rol:</b> <span th:text="${cliente.rol}"></span></p>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/clientes}" class="btn btn-secondary">Volver</a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/clientes/{id}/editar(id=${cliente.id})}"
               class="btn btn-warning">
                Editar
            </a>
        </div>
    </div>
</body>
</html>
