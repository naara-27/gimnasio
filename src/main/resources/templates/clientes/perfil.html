<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Gestión de Clientes</span>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/clientes/perfil}" class="text-white text-decoration-none">Mi Perfil</a>
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <h3>Mi Perfil</h3>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/perfil/actualizar}" method="post" th:object="${cliente}">

                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{rol}">
                    <input type="hidden" th:field="*{activo}">

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cédula</label>
                        <input type="text" th:field="*{cedula}" class="form-control"
                               th:classappend="${#fields.hasErrors('cedula')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{cedula}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control"
                               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{telefono}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nueva Contraseña (opcional)</label>
                        <input type="password" name="nuevaPassword" class="form-control"
                               placeholder="Dejar vacío para no cambiarla">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirmar Contraseña</label>
                        <input type="password" name="confirmPassword" class="form-control"
                               placeholder="Confirme la nueva contraseña">
                    </div>

                    <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
                    <a th:href="@{/clientes/perfil}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Volver al listado</a>
        </div>
    </div>
</body>
</html>
