<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand">Gestión de Clientes</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white">Hola, <b sec:authentication="name"></b></span>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </nav>

    <div class="container mt-4">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <h3>Mi Perfil</h3>

        <div class="card">
            <div class="card-body">
                <p><b>Nombre:</b> <span th:text="${cliente.nombre}"></span></p>

                <p><b>Cédula:</b> <span th:text="${cliente.cedula}"></span></p>

                <p><b>Teléfono:</b> <span th:text="${cliente.telefono}"></span></p>

                <p><b>Correo:</b> <span th:text="${cliente.email}"></span></p>

                <p>
                    <b>Rol:</b>
                    <span th:text="${cliente.rol}"></span>
                </p>

                <p>
                    <b>Estado:</b>
                    <span th:classappend="${cliente.activo} ? 'bg-success' : 'bg-secondary'"
                          class="badge"
                          th:text="${cliente.activo} ? 'Activo' : 'Inactivo'">
                    </span>
                </p>
            </div>
        </div>

        <div class="mt-3">
            <a th:href="@{/clientes}" class="btn btn-secondary">Volver al listado</a>
        </div>
    </div>
</body>
</html>
