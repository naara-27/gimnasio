<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Clases</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"
                        th:text="${modo == 'crear'} ? 'Registrar nueva clase' : 'Editar clase'">
                        Clase
                    </h4>
                </div>

                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger"
                         th:text="${error}"></div>

                    <form th:action="${modo == 'crear'} ?
                              @{/clases/guardar} :
                              @{/clases/{id}/actualizar(id=${clase.id})}"
                          th:object="${clase}"
                          method="post">

                        <!-- Nombre -->
                        <div class="mb-3">
                            <label class="form-label">Nombre de la clase</label>
                            <input type="text"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   placeholder="Ejemplo: Yoga"
                                   required>
                            <div class="text-danger" th:errors="*{nombre}"></div>
                        </div>

                        <!-- Tipo -->
                        <div class="mb-3">
                            <label class="form-label">Tipo de clase</label>
                            <select th:field="*{tipo}" class="form-select" required>
                                <option value="">Seleccione el tipo</option>
                                <option value="Cardio">Cardio</option>
                                <option value="Fuerza">Fuerza</option>
                                <option value="Yoga">Yoga</option>
                                <option value="Pilates">Pilates</option>
                                <option value="Spinning">Spinning</option>
                                <option value="Funcional">Entrenamiento funcional</option>
                            </select>
                            <div class="text-danger" th:errors="*{tipo}"></div>
                        </div>

                        <!-- Entrenador (CORREGIDO con name="entrenadorId") -->
                        <div class="mb-3">
                            <label class="form-label">Entrenador</label>
                            
                            <select name="entrenadorId" class="form-select" required>
                                <option value="">Seleccione un entrenador</option>
                                <option th:each="entrenador : ${entrenadores}"
                                        th:value="${entrenador.id}"
                                        th:text="${entrenador.nombre}"
                                        th:selected="${clase.entrenador != null and clase.entrenador.id == entrenador.id}">
                                </option>
                            </select>

                            <div class="text-danger" th:errors="*{entrenador}"></div>
                        </div>

                        <!-- Fecha -->
                        <div class="mb-3">
                            <label class="form-label">Fecha de la clase</label>
                            <input type="date"
                                   th:field="*{fecha}"
                                   class="form-control"
                                   required>
                            <div class="text-danger" th:errors="*{fecha}"></div>
                        </div>

                        <!-- Hora de inicio -->
                        <div class="mb-3">
                            <label class="form-label">Hora de inicio</label>
                            <input type="time"
                                   th:field="*{horaInicio}"
                                   class="form-control"
                                   required>
                            <div class="text-danger" th:errors="*{horaInicio}"></div>
                        </div>

                        <!-- Duración -->
                        <div class="mb-3">
                            <label class="form-label">Duración</label>
                            <input type="text"
                                   class="form-control"
                                   value="1 hora"
                                   readonly>
                            <small class="text-muted">La hora de finalización se calcula automáticamente.</small>
                        </div>

                        <!-- Cupo máximo -->
                        <div class="mb-3">
                            <label class="form-label">Cupo máximo</label>
                            <input type="number"
                                   th:field="*{cupoMaximo}"
                                   class="form-control"
                                   min="1"
                                   required>
                            <div class="text-danger" th:errors="*{cupoMaximo}"></div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                Guardar clase
                            </button>
                            <a th:href="@{/clases}" class="btn btn-secondary">
                                Cancelar
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
