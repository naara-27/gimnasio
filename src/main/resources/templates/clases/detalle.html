
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Clase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Detalle de la Clase</h3>
                </div>

                <div class="card-body">

                    <div class="mb-4">
                        <h4 class="fw-bold" th:text="${clase.nombre}"></h4>
                        <span class="badge bg-info text-dark"
                              th:text="${clase.tipo}"></span>
                    </div>

                    <hr>

                    <div class="row mb-3">
                        <div class="col-sm-5 fw-bold">Código de clase:</div>
                        <div class="col-sm-7" th:text="${clase.id}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-5 fw-bold">Entrenador:</div>
                        <div class="col-sm-7"
                             th:text="${clase.entrenador.nombre}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-5 fw-bold">Fecha:</div>
                        <div class="col-sm-7"
                             th:text="${clase.fecha}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-5 fw-bold">Hora de inicio:</div>
                        <div class="col-sm-7"
                             th:text="${clase.horaInicio}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-5 fw-bold">Hora de finalización:</div>
                        <div class="col-sm-7"
                             th:text="${clase.horaFinalizacion}"></div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-5 fw-bold">Duración:</div>
                        <div class="col-sm-7">1 hora</div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-sm-5 fw-bold">Cupo máximo:</div>
                        <div class="col-sm-7"
                             th:text="${clase.cupoMaximo}"></div>
                    </div>

                    <hr>

                    <div class="d-flex gap-2">

                        <a th:href="@{/clases}"
                           class="btn btn-secondary">
                            Volver
                        </a>

                        <a th:href="@{/clases/{id}/editar(id=${clase.id})}"
                           class="btn btn-warning">
                            Editar clase
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
