
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clases</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Gestión de Clases</h2>
            <p class="text-muted">Administración de las clases del gimnasio</p>
        </div>

        <a th:href="@{/clases/nuevo}" class="btn btn-primary">
            + Nueva clase
        </a>
    </div>

    <!-- Mensajes -->
    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Buscador -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/clases}" method="get" class="row g-2">

                <div class="col-md-10">
                    <input type="text"
                           name="q"
                           class="form-control"
                           placeholder="Buscar por nombre o tipo de clase..."
                           th:value="${q}">
                </div>

                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-dark">
                        Buscar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Tabla de clases -->
    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Entrenador</th>
                            <th>Fecha</th>
                            <th>Hora de inicio</th>
                            <th>Finalización</th>
                            <th>Cupo máximo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="clase : ${clases}">

                            <td th:text="${clase.id}"></td>
                            <td th:text="${clase.nombre}"></td>
                            <td th:text="${clase.tipo}"></td>
                            <td th:text="${clase.entrenador.nombre}"></td>
                            <td th:text="${clase.fecha}"></td>
                            <td th:text="${clase.horaInicio}"></td>
                            <td th:text="${clase.horaFinalizacion}"></td>
                            <td th:text="${clase.cupoMaximo}"></td>

                            <td>
                                <div class="d-flex gap-1">

                                    <a th:href="@{/clases/{id}(id=${clase.id})}"
                                       class="btn btn-sm btn-info">
                                        Ver
                                    </a>

                                    <a th:href="@{/clases/{id}/editar(id=${clase.id})}"
                                       class="btn btn-sm btn-warning">
                                        Editar
                                    </a>

                                    <form th:action="@{/clases/{id}/eliminar(id=${clase.id})}"
                                          method="post"
                                          onsubmit="return confirm('¿Desea eliminar esta clase?')">

                                        <button type="submit"
                                                class="btn btn-sm btn-danger">
                                            Eliminar
                                        </button>

                                    </form>

                                </div>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(clases)}">
                            <td colspan="9" class="text-center text-muted py-4">
                                No hay clases registradas.
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-outline-secondary">
            Volver al inicio
        </a>
    </div>

</div>

</body>
</html>
