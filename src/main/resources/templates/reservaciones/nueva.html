
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar una clase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Reservar una clase</h4>
                </div>

                <div class="card-body">

                    <p class="text-muted">
                        Seleccioná la clase en la que deseas reservar tu cupo.
                        La reservación quedará registrada automáticamente a tu nombre.
                    </p>

                    <form th:action="@{/reservaciones/guardar}" method="post">

                        <!-- Protección CSRF -->
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- Seleccionar clase -->
                        <div class="mb-4">

                            <label class="form-label">
                                Seleccionar clase
                            </label>

                            <select name="claseId"
                                    class="form-select"
                                    required>

                                <option value="">Seleccione una clase</option>

                                <option th:each="clase : ${clases}"
                                    th:value="${clase.id}"
                                    th:text="${clase.nombre + ' - ' + clase.fecha + ' - ' + clase.horaInicio + ' - Entrenador: ' + clase.entrenador.nombre + ' - Cupos disponibles: ' + cuposDisponibles[clase.id]}">
                                </option>

                            </select>
                            
                        </div>

                        <div class="d-flex justify-content-between">

                            <a th:href="@{/reservaciones/mis-reservaciones}"
                               class="btn btn-secondary">
                                Mis reservaciones
                            </a>

                            <button type="submit" class="btn btn-primary">
                                Reservar cupo
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
