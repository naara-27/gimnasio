
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Reservaciones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Reservaciones</h2>

        <a th:href="@{/clases}" class="btn btn-secondary">
            Volver a clases
        </a>
    </div>

    <!-- Mensajes -->
    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Tabla -->
    <div class="card shadow">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Clase</th>
                            <th>Entrenador</th>
                            <th>Fecha de clase</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Fecha de reservación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="r : ${reservaciones}">

                            <td th:text="${r.id}"></td>

                            <td th:text="${r.cliente.nombre}"></td>

                            <td th:text="${r.clase.nombre}"></td>

                            <td th:text="${r.clase.entrenador.nombre}"></td>

                            <td th:text="${#temporals.format(r.clase.fecha, 'dd/MM/yyyy')}"></td>

                            <td th:text="${#temporals.format(r.clase.horaInicio, 'HH:mm')}"></td>

                            <td>
                                <span class="badge"
                                      th:classappend="${r.estado == 'CONFIRMADA'} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${r.estado}">
                                </span>
                            </td>

                            <td th:text="${#temporals.format(r.fechaReservacion, 'dd/MM/yyyy HH:mm')}"></td>

                            <td>
                                <form th:if="${r.estado == 'CONFIRMADA'}"
                                    th:action="@{/reservaciones/{id}/cancelar(id=${r.id})}"
                                     method="post"
                                    onsubmit="return confirm('¿Desea cancelar esta reservación?');">

                                 <input type="hidden"
                                    th:name="${_csrf.parameterName}"
                                     th:value="${_csrf.token}">

                                 <button type="submit" class="btn btn-sm btn-danger">
                                    Cancelar
                                    </button>

                                </form>

                                <span th:if="${r.estado == 'CANCELADA'}"
                                      class="text-muted">
                                    Cancelada
                                </span>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(reservaciones)}">
                            <td colspan="9" class="text-center text-muted py-4">
                                No hay reservaciones registradas.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>

</body>
</html>
