<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 400px; margin-top: 10vh;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center">Iniciar Sesión</h3>

                <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña incorrectos, o cuenta inactiva</div>
                <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión con éxito</div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>

                <p class="text-muted small mt-3 mb-0">
                    <a th:href="@{/clientes/recuperar-password}" class="text-decoration-none">¿Olvidaste tu contraseña?</a><br>
                    Pruebe: <b>admin@gimnasio.com/admin123</b>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
