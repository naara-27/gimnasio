<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 400px; margin-top: 10vh;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center">Recuperar Contraseña</h3>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

                <form th:action="@{/clientes/recuperar-password}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" required autofocus
                               th:value="${email != null ? email : ''}">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Enviar instrucciones</button>
                </form>

                <p class="text-muted small mt-3 mb-0">
                    <a th:href="@{/login}">¿Ya recuerdas tu contraseña? Inicia sesión</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
